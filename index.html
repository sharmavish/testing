<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>testing | sharmavish</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #1c1917;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, #dbeafe 0%, transparent 45%),
          radial-gradient(circle at 80% 10%, #ccfbf1 0%, transparent 40%),
          var(--bg);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        line-height: 1.5;
        opacity: 0.85;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>testing</h1>
      <p>
        GitHub Pages project site for
        <a href="https://github.com/sharmavish/testing">sharmavish/testing</a>.
      </p>
    </main>
  </body>
</html>
